# Optional Postgres + API + jobs + admin stack.
# SQLite works without Docker — see docs/SETUP.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screenless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screenless}
      POSTGRES_DB: ${POSTGRES_DB:-screenless}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - screenless_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screenless}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-screenless}:${POSTGRES_PASSWORD:-screenless}@db:5432/${POSTGRES_DB:-screenless}
      JWT_SECRET: ${JWT_SECRET:-screenless-dev-secret-change-me}
      ADMIN_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  jobs:
    build:
      context: ./services/jobs
    environment:
      NODE_ENV: production
      PORT: 4001
      API_URL: http://api:4000
      DATABASE_URL: postgres://${POSTGRES_USER:-screenless}:${POSTGRES_PASSWORD:-screenless}@db:5432/${POSTGRES_DB:-screenless}
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: ./web/admin-panel
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  screenless_pg:
